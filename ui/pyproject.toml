[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbusua-ui"
version = "0.7.0"
description = "Engineering web UI for modbusua Gateway"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "asyncua>=1.1",
  "pymodbus>=3.15,<4",
]
